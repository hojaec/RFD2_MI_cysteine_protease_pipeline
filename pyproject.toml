[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protease-design-pipeline"
version = "0.1.0"
description = "Computational pipeline for de novo design of cysteine proteases with a Cys-His-Asp catalytic triad."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hojae Choi" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "biopython>=1.81",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[tool.setuptools]
packages = ["protease_pipeline"]
